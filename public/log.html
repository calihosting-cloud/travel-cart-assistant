<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Travel Cart Assistant GT — Log</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 12px;
      }
      h1 { font-size: 16px; margin: 0 0 8px; color: #93c5fd; }
      .hint { color: #94a3b8; margin-bottom: 12px; }
      .toolbar { margin-bottom: 12px; display: flex; gap: 8px; }
      button {
        background: #1e40af;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button.secondary { background: #334155; }
      #log {
        white-space: pre-wrap;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 12px;
        min-height: 60vh;
        line-height: 1.45;
      }
      .error { color: #fca5a5; }
      .warn { color: #fcd34d; }
      .info { color: #a7f3d0; }
    </style>
  </head>
  <body>
    <h1>Travel Cart Assistant GT — Log</h1>
    <p class="hint">
      Visible desde chrome://extensions → Travel Cart Assistant GT → Detalles → Opciones de extensión.
      También puedes inspeccionar el service worker para ver la consola en vivo.
    </p>
    <div class="toolbar">
      <button type="button" id="btn-refresh">Actualizar</button>
      <button type="button" id="btn-clear" class="secondary">Vaciar log</button>
    </div>
    <div id="log">Cargando…</div>
    <script type="module" src="./log.js"></script>
  </body>
</html>
